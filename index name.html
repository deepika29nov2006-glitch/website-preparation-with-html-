
<!DOCTYPE html><!--modern Html-->
<html lang="en">
    <head><!-- info about page, not visible to user-->
        <mete charset=""UTF-8"><!--charcter encoding-->
        <meta name="viewport" content="width=device-width">
        <title>Form </title><!--sets the title -->
    </head>
    <body>
        <form><b>Registration form</b></form>
        <br>
    <label>Student Name:</label>
    <input type="text" name="student_name"><br><br>

    <label>Father's Name:</label>
    <input type="text" name="father_name"><br><br>

    <label>Date of Birth:</label>
    <input type="date" name="dob"><br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    <label>Email:</label>
    <input type="email" name="email"><br><br>

    <label>Mobile Number:</label>
    <input type="tel" name="mobile"><br><br>

    <label>Address:</label>
    <textarea name="address"></textarea><br><br>

    <label>Course Applied For:</label>
    <select name="course">
        <option>B.Tech</option>
        <option>BCA</option>
        <option>B.Sc</option>
        <option>BBA</option>
    </select><br><br>

    <label>Upload Photograph:</label>
    <input type="file" name="photo"><br><br>

    <label>
        <input type="checkbox" name="declaration">
        I declare that the information provided is correct.
    </label><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>
</body>
</html>
